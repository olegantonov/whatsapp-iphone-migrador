name: Testar e publicar

# Todo push na main roda os testes. Se a versão em migrador/versao.py ainda não tiver
# release, o executável é gerado, passa pelo autoteste e é publicado; os programas
# instalados recebem a atualização automaticamente.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testar-e-publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Testes
        run: python -m pytest -q

      - name: Conferir se a versão já foi publicada
        id: versao
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (python main.py --versao).Trim()
          "versao=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) {
            "publicar=nao" >> $env:GITHUB_OUTPUT
            Write-Host "v$v já publicada; nada a fazer (aumente migrador/versao.py para publicar)."
          } else {
            "publicar=sim" >> $env:GITHUB_OUTPUT
          }
          $global:LASTEXITCODE = 0

      - name: Gerar executável e autoteste
        if: steps.versao.outputs.publicar == 'sim'
        shell: pwsh
        run: ./tools/empacotar.ps1

      - name: Publicar release
        if: steps.versao.outputs.publicar == 'sim'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.versao.outputs.versao }}"
          gh release create "v$v" dist/MigradorWhatsApp-win64.zip dist/MigradorWhatsApp-win64.zip.sha256 `
            --title "Versão $v" --generate-notes
